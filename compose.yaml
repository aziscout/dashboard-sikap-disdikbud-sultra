services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sikap_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sikap-net

  web:
    image: nginx:alpine
    container_name: sikap_web
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - sikap-net

  db:
    image: mysql:8.0
    container_name: sikap_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dashboard_sikap
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: sikap_user
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sikap-net

networks:
  sikap-net:
    driver: bridge

volumes:
  dbdata:
    driver: local